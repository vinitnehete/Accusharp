spring.datasource.url=jdbc:h2:mem:hrms-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
hrms.seed.enabled=false
server.address=0.0.0.0
jwt.secret=test-only-secret-key-not-for-any-real-use-0123456789abcdef
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7
spring.jpa.open-in-view=false

# High enough that no test suite run trips it - the IP-based limiter itself is
# unit-tested directly in LoginRateLimiterTest with its own small thresholds.
# All HTTP tests share one loopback address and a Spring test context that
# may be reused across test classes, so a low real-world threshold here would
# make unrelated later tests fail with 429 instead of what they're testing.
security.login-rate-limit.max-failures=100000
security.login-rate-limit.window-minutes=5

# The HTTP tests drive the API over plain http://localhost, so a Secure
# cookie would never come back on the response and every refresh/logout test
# would fail for a reason unrelated to what it is testing.
app.auth.cookie.secure=false

# Fixed, non-secret key: the tests need a valid one, and it must be deterministic.
app.security.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# Mirrors the main profile's default. Test resources shadow the main
# application.properties entirely, so anything the app reads at startup has to
# be repeated here or it is simply absent during tests.
app.cors.allowed-origins=http://localhost:3000

# The audit-purge retention floor is disabled here because the suite purges rows
# it wrote moments earlier. The floor itself is covered by
# AuditPurgeGuardTest, which sets its own non-zero value.
app.audit.minimum-retention-days=0
