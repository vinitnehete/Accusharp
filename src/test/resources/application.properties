spring.datasource.url=jdbc:h2:mem:hrms-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
hrms.seed.enabled=false

jwt.secret=test-only-secret-key-not-for-any-real-use-0123456789abcdef
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7
spring.jpa.open-in-view=false

# High enough that no test suite run trips it - the IP-based limiter itself is
# unit-tested directly in LoginRateLimiterTest with its own small thresholds.
# All HTTP tests share one loopback address and a Spring test context that
# may be reused across test classes, so a low real-world threshold here would
# make unrelated later tests fail with 429 instead of what they're testing.
security.login-rate-limit.max-failures=100000
security.login-rate-limit.window-minutes=5
