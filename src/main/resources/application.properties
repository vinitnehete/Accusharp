spring.application.name=hrms
server.port=8080

# --- Datasource: MySQL (default) -------------------------------------------
# Override DB_USERNAME/DB_PASSWORD via environment variables in any shared or
# production environment - the defaults below are for local development only.
# Overridable via SPRING_DATASOURCE_URL (Spring's relaxed binding puts
# environment variables above this file). Written explicitly so that is
# obvious rather than folklore. Note createDatabaseIfNotExist is a local-dev
# convenience - a production URL should point at a database that already
# exists, provisioned with a least-privilege user.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Seed masters + demo data on an empty database.
hrms.seed.enabled=true
# HRMS_SEED_PLATFORM_OWNER_PASSWORD MUST be overridden via environment variable
# outside local dev - the default below is a fixed, publicly-visible value and
# the app refuses to start with it on any database that doesn't already have a
# platform_owner account (see DataSeeder).
hrms.seed.platform-owner-password=${HRMS_SEED_PLATFORM_OWNER_PASSWORD:Accusharp@123}

logging.level.com.accusharp.hrms=INFO

# --- Security ----------------------------------------------------------------
# JWT_SECRET MUST be overridden via environment variable outside local dev -
# this default is a fixed, publicly-visible value and provides no security
# once this repository is public or shared. Needs to be >= 256 bits for HS256.
jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-change-me-0123456789abcdef}
jwt.issuer=accusharp-hrms
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7

security.max-failed-login-attempts=5
# IP-based brake on /api/auth/login, independent of which account is being
# tried - see LoginRateLimiter's Javadoc.
security.login-rate-limit.max-failures=15
security.login-rate-limit.window-minutes=5

# --- Encryption at rest -------------------------------------------------------
# Protects employee bank account, IFSC, UAN and ESIC numbers (see
# EncryptedStringConverter). MUST be overridden outside local dev - the app
# refuses to start on the placeholder below rather than writing data that only
# looks encrypted. Generate with:  openssl rand -base64 32
app.security.encryption-key=${APP_ENCRYPTION_KEY:dev-only-insecure-encryption-key-change-me}

# --- Trusted reverse proxies --------------------------------------------------
# Comma-separated IPs or CIDR ranges whose X-Forwarded-For header is believed.
# EMPTY BY DEFAULT ON PURPOSE: with nothing configured the header is ignored
# and login throttling keys on the real socket address, so a direct client
# cannot spoof its way into a fresh rate-limit bucket. Set this to the
# proxy/load-balancer address once one is actually in front of the app,
# otherwise every request will appear to come from that proxy.
app.security.trusted-proxies=${APP_TRUSTED_PROXIES:}

# --- Refresh-token cookie -----------------------------------------------------
# The refresh token is delivered ONLY as an httpOnly cookie (see
# RefreshTokenCookie). "secure" must stay true anywhere the app is reachable
# over a network - a browser will not store a Secure cookie from a plain
# http:// origin, which is why the h2 dev profile turns it off rather than
# this file weakening the default for everyone.
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}
# Strict is the CSRF control for /api/auth/refresh and /api/auth/logout - see
# SecurityConfig's Javadoc before relaxing this to Lax.
app.auth.cookie.same-site=Strict

# Comma-separated list of origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
