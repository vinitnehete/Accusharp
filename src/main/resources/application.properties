spring.application.name=hrms
server.port=8080

# --- Datasource: MySQL (default) -------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vinit?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Seed masters + demo data on an empty database.
hrms.seed.enabled=true

logging.level.com.accusharp.hrms=INFO
