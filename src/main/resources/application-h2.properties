# Run without MySQL:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:hrms;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Local development has no TLS, and a browser will not store a Secure cookie
# from http://localhost in every browser - so the refresh cookie drops the
# Secure flag under this profile only. Never set this in the default profile.
app.auth.cookie.secure=false

# Fixed, non-secret key so local dev works out of the box. Never used anywhere real.
app.security.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
