name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads code.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify, not test: also runs packaging, so a build that only fails at
      # repackage time is caught here rather than at deploy time.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Fails the build on CVSS >= 7. This app holds salary and bank data, so a
      # High in a transitive dependency should block a release, not appear in a
      # report nobody opens.
      - name: OWASP Dependency-Check
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -Dformat=HTML
          -DfailBuildOnCVSS=7
          -DassemblyAnalyzerEnabled=false

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  secret-scan:
    name: Committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository legitimately contains placeholder secrets that the app
      # refuses to start with. This catches a real one being committed next to
      # them, which is exactly the mistake those placeholders invite.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
